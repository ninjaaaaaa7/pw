[project]
name = "clausewise-backend"
version = "1.0.0"
description = "GenAI legal document assistant: deterministic clause engine + grounded Gemini layer."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"app/sample_data.py" = ["E501"]  # prose fixture, not code
